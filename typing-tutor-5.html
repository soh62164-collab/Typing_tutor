/* ============================================================
   SOUND EFFECTS (synthesized, fully offline — no audio files)
   ============================================================ */
let audioCtx = null;
let soundOn = true;

function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, duration, type, vol){
  if(!soundOn) return;
  ensureAudio();
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.start(now);
  osc.stop(now + duration);
}

function playKeySound(){ beep(680, 0.06, 'sine', 0.28); }
function playErrorSound(){
  beep(190, 0.14, 'square', 0.32);
  setTimeout(()=>beep(140, 0.16, 'square', 0.28), 60);
}
function playCompleteSound(){
  beep(520, 0.1, 'sine', 0.26);
  setTimeout(()=>beep(780, 0.18, 'sine', 0.26), 100);
}

document.getElementById('sound-btn').addEventListener('click', ()=>{
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) ensureAudio();
});

/* ============================================================

"show","side","since","small","social","something","sound","south","state",
"still","story","student","study","such","sure","system","take","talk","team",
"tell","thing","think","those","thought","three","through","today","together",
"turn","under","until","upon","used","using","value","voice","wait","walk",

"while","white","whole","without","word","world","would","write","young","zero"];

function wordsUsingOnly(letters, count, minLen=2, maxLen=6){
  const set = new Set(letters);
  const pool = WORD_BANK.filter(w => w.length>=minLen && w.length<=maxLen &&
    [...w].every(ch => set.has(ch)));
  const out = [];
  if(pool.length === 0) return null;
  for(let i=0;i<count;i++){
    out.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  return out.join(' ');
}

function drillText(newKeys, learnedKeys, wordCount=16){
  const all = [...new Set([...learnedKeys, ...newKeys])];
  const out = [];
  for(let i=0;i<wordCount;i++){
    const len = 2 + Math.floor(Math.random()*3); // 2-4 chars
    let word = '';
    let hasNew = false;
    for(let j=0;j<len;j++){
      const useNew = (!hasNew && j===len-1) || Math.random() < 0.45;
      const src = useNew ? newKeys : all;
      const ch = src[Math.floor(Math.random()*src.length)];
      if(newKeys.includes(ch)) hasNew = true;
      word += ch;
    }
    out.push(word);
  }
  return out.join(' ');
}

function numberDrill(digits, count=14){
  const out = [];
  for(let i=0;i<count;i++){
    const len = 2 + Math.floor(Math.random()*2);
    let n='';
    for(let j=0;j<len;j++) n += digits[Math.floor(Math.random()*digits.length)];
    out.push(n);
  }
  return out.join(' ');
}

function sentenceDrill(letters, count=6){
  const words = wordsUsingOnly(letters, count*5, 2, 7);
  if(!words) return null;
  const arr = words.split(' ');
  const sentences = [];
  for(let i=0;i<count;i++){
    const len = 3 + Math.floor(Math.random()*3);
    const chunk = arr.splice(0, len);
    if(chunk.length===0) break;
    let s = chunk.join(' ');
    s = s.charAt(0).toUpperCase() + s.slice(1) + '.';
    sentences.push(s);
  }
  return sentences.join(' ');
}

function wordListWithPunct(letters, count=32){
  const words = wordsUsingOnly(letters, count, 2, 7);
  if(!words) return null;
  const arr = words.split(' ');
  const out = [];
  for(let i=0;i<arr.length;i++){
    const isLastOfGroup = (i+1) % 6 === 0 || i === arr.length-1;
    out.push(arr[i] + (isLastOfGroup ? '.' : ','));
  }
  return out.join(' ');
}

function paragraphDrill(letters, sentenceCount=10){
  return sentenceDrill(letters, sentenceCount);
}

    { id:'p3', name:'প্যারাগ্রাফ ৩', newKeys:[], type:'paragraph' },
    { id:'p4', name:'প্যারাগ্রাফ ৪', newKeys:[], type:'paragraph' },
    { id:'p5', name:'প্যারাগ্রাফ ৫', newKeys:[], type:'paragraph' },
    { id:'p6', name:'প্যারাগ্রাফ ৬', newKeys:[], type:'paragraph' },
    { id:'p7', name:'প্যারাগ্রাফ ৭', newKeys:[], type:'paragraph' },
    { id:'p8', name:'প্যারাগ্রাফ ৮', newKeys:[], type:'paragraph' },
  ]},
];

const ALL_LETTERS = ['f','j','d','k','s','l','a',';','g','h','r','u','e','i','w','o','q','p','t','y',
  'v','m','c','n','x',',','z','.','b','/'];
const FLAT_LESSONS = [];
(function build(){
  let learned = [];
  STAGES.forEach(stage=>{
    stage.lessons.forEach(lsn=>{
      lsn.learnedBefore = [...learned];
      if(lsn.newKeys && lsn.type==='drill') learned = [...learned, ...lsn.newKeys];
      if(['words','sentence','wordlist','paragraph'].includes(lsn.type)) lsn.newKeys = [...lsn.learnedBefore];
      FLAT_LESSONS.push(lsn);
    });
  });
})();

function generateLessonText(lsn){
  if(lsn.type==='drill'){
    return drillText(lsn.newKeys, lsn.learnedBefore.length ? lsn.learnedBefore : lsn.newKeys);
  }
  if(lsn.type==='words'){
    return wordsUsingOnly(lsn.newKeys, 24) || drillText(lsn.newKeys, lsn.newKeys);
  }
  if(lsn.type==='numbers'){
    return numberDrill(lsn.newKeys);
  }
  if(lsn.type==='sentence'){
    return sentenceDrill(lsn.newKeys, 6) || wordsUsingOnly(lsn.newKeys, 24);
  }
  if(lsn.type==='wordlist'){
    return wordListWithPunct(lsn.newKeys, 34) || wordsUsingOnly(lsn.newKeys, 24);
  }
  if(lsn.type==='paragraph'){
    return paragraphDrill(lsn.newKeys, 10) || sentenceDrill(lsn.newKeys, 6);
  }
  return '';
}

/* ============================================================
   KEYBOARD LAYOUT + FINGER MAP
   ============================================================ */
const FINGER_MAP = {
  '`':'lpinky','1':'lpinky','q':'lpinky','a':'lpinky','z':'lpinky',
  '2':'lring','w':'lring','s':'lring','x':'lring',
  '3':'lmid','e':'lmid','d':'lmid','c':'lmid',
  '4':'lidx','5':'lidx','r':'lidx','t':'lidx','f':'lidx','g':'lidx','v':'lidx','b':'lidx',
  '6':'ridx','7':'ridx','y':'ridx','u':'ridx','h':'ridx','j':'ridx','n':'ridx','m':'ridx',
  '8':'rmid','i':'rmid','k':'rmid',',':'rmid',
  '9':'rring','o':'rring','l':'rring','.':'rring',
  '0':'rpinky','-':'rpinky','p':'rpinky',';':'rpinky','/':'rpinky','[':'rpinky',']':'rpinky',
  "'":'rpinky','\\':'rpinky',
  ' ':'thumb'
};
const FINGER_NAME = {
  lpinky:'বাম কনিষ্ঠা', lring:'বাম অনামিকা', lmid:'বাম মধ্যমা', lidx:'বাম তর্জনী',
  ridx:'ডান তর্জনী', rmid:'ডান মধ্যমা', rring:'ডান অনামিকা', rpinky:'ডান কনিষ্ঠা', thumb:'বৃদ্ধাঙ্গুলি'
};

const KB_ROWS = [
  [['1',1],['2',1],['3',1],['4',1],['5',1],['6',1],['7',1],['8',1],['9',1],['0',1]],
  [['q',1],['w',1],['e',1],['r',1],['t',1],['y',1],['u',1],['i',1],['o',1],['p',1]],
  [['a',1],['s',1],['d',1],['f',1],['g',1],['h',1],['j',1],['k',1],['l',1],[';',1]],
  [['z',1],['x',1],['c',1],['v',1],['b',1],['n',1],['m',1],[',',1],['.',1],['/',1]],
  [[' ',6]]
];
const HOME_KEYS = new Set(['f','j']);

function renderKeyboard(){
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(row=>{
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(([ch,w])=>{
      const keyEl = document.createElement('div');
      keyEl.className = 'key';
      if(w===6) keyEl.classList.add('w-6');
      keyEl.dataset.key = ch;
      keyEl.textContent = ch===' ' ? '' : ch;
      keyEl.style.color = 'var(--f-'+FINGER_MAP[ch]+')';
      if(HOME_KEYS.has(ch)) keyEl.classList.add('home-dot');
      rowEl.appendChild(keyEl);
    });
    kb.appendChild(rowEl);
  });
}

function highlightKey(ch, cls){
  document.querySelectorAll('.key.next').forEach(k=>k.classList.remove('next'));
  if(!ch) return;
  const target = ch===' ' ? ' ' : ch.toLowerCase();
  const el = [...document.querySelectorAll('.key')].find(k => k.dataset.key === target);
  if(el) el.classList.add(cls);
}

function flashPress(ch){
  const target = ch===' ' ? ' ' : ch.toLowerCase();
  const el = [...document.querySelectorAll('.key')].find(k => k.dataset.key === target);
  if(el){
    el.classList.add('pressed');
    setTimeout(()=>el.classList.remove('pressed'), 90);
  }
}

/* ============================================================
   PROGRESS STORAGE (Using standard localStorage)
   ============================================================ */
const STORAGE_KEY = 'typingtutor:progress';
let progress = { completed:{}, unlockedIndex:0 };

async function loadProgress(){
  try{
    const r = localStorage.getItem(STORAGE_KEY);
    if(r) progress = JSON.parse(r);
  }catch(e){ /* no saved progress yet */ }
}

async function saveProgress(){
  try{ 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); 
  }
  catch(e){ console.error('save failed', e); }
}

/* ============================================================
   HOME SCREEN RENDER
   ============================================================ */
function renderHome(){
  const list = document.getElementById('stage-list');
  list.innerHTML = '';
  let flatIndex = 0;
  STAGES.forEach(stage=>{
    const block = document.createElement('div');
    block.className = 'stage-block';
    const t = document.createElement('div');
    t.className = 'stage-title';
    t.textContent = stage.title;
    block.appendChild(t);

    stage.lessons.forEach(lsn=>{
      const idx = flatIndex++;
      const row = document.createElement('div');
      const done = progress.completed[lsn.id];
      const locked = idx > progress.unlockedIndex;
      const current = idx === progress.unlockedIndex && !done;
      row.className = 'lesson-row' + (locked?' locked':'') + (done?' done':'') + (current?' current':'');
      let subtitle;
      if(lsn.type === 'drill') subtitle = 'নতুন কী: ' + lsn.newKeys.join(' ').toUpperCase();
      else if(lsn.type === 'numbers') subtitle = 'সংখ্যা: ' + lsn.newKeys.join(' ');
      else if(lsn.type === 'words') subtitle = 'শব্দ অনুশীলন';
      else if(lsn.type === 'wordlist') subtitle = 'শব্দ-তালিকা (স্পেস, কমা, ফুলস্টপ)';
      else if(lsn.type === 'sentence') subtitle = 'পূর্ণ বাক্য অনুশীলন';
      else if(lsn.type === 'paragraph') subtitle = 'প্যারাগ্রাফ অনুশীলন';
      else subtitle = 'অনুশীলন';
      row.innerHTML = `
        <div class="lesson-num">${done ? '✓' : (idx+1)}</div>
        <div class="lesson-info">
          <div class="name">${lsn.name}</div>
          <div class="keys">${subtitle}</div>
        </div>
        ${done ? `<div class="lesson-score"><span class="wpm-num">${done.wpm}</span>WPM</div>` : ''}
      `;
      if(!locked){
        row.addEventListener('click', ()=> openLesson(idx));
      }
      block.appendChild(row);
    });
    list.appendChild(block);
  });
}

/* ============================================================
   LESSON RUNTIME
   ============================================================ */
let session = null;

function openLesson(idx){
  const lsn = FLAT_LESSONS[idx];
  const text = generateLessonText(lsn) || 'the quick brown fox';
  session = {
    idx, lsn, text,
    pos:0, mistakes:0, totalTyped:0,
    startTime:null,
  };
  document.getElementById('lesson-title').textContent = lsn.name;
  document.getElementById('lesson-keys-badge').textContent =
    lsn.newKeys.length && lsn.newKeys.length<=6 ? lsn.newKeys.join(' ').toUpperCase() : '';
  renderText();
  updateStats();
  showScreen('screen-lesson');
  const hint = document.getElementById('finger-hint');
  const nextCh = session.text[0];
  hint.innerHTML = `পরের কী চাপুন: <b>${nextCh===' '?'স্পেস':nextCh.toUpperCase()}</b> — ${FINGER_NAME[FINGER_MAP[nextCh.toLowerCase()]||'thumb']}`;
  highlightKey(nextCh, 'next');
  const input = document.getElementById('hidden-input');
  input.value = '';
  setTimeout(()=>input.focus(), 50);
}

function renderText(){
  const disp = document.getElementById('text-display');
  disp.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(let i=0;i<session.text.length;i++){
    const span = document.createElement('span');
    span.className = 'ch';
    span.textContent = session.text[i] === ' ' ? '\u00A0' : session.text[i];
    if(i < session.pos) span.classList.add('correct');
    if(i === session.pos) span.classList.add('current');
    frag.appendChild(span);
  }
  disp.appendChild(frag);
}

function updateStats(){
  const elapsedMs = session.startTime ? (Date.now() - session.startTime) : 0;
  const elapsedMin = elapsedMs / 60000;
  const correctChars = session.totalTyped - session.mistakes;

  let wpm = 0;
  if(elapsedMs >= 1000 && correctChars > 0){
    wpm = Math.round((correctChars / 5) / elapsedMin);
  }

  const acc = session.totalTyped > 0
    ? Math.round((correctChars / session.totalTyped) * 1000) / 10  
    : 100;
  const pct = Math.round((session.pos / session.text.length) * 100);

  document.getElementById('stat-wpm').textContent = wpm;
  document.getElementById('stat-acc').textContent = acc + '%';
  document.getElementById('stat-progress').textContent = pct + '%';
  return {wpm, acc};
}

function handleChar(typed){
  if(!session) return;
  if(session.startTime === null) session.startTime = Date.now();
  const expected = session.text[session.pos];
  const span = document.querySelectorAll('#text-display .ch')[session.pos];
  if (!span) return;
  span.classList.remove('current');

  if(typed === expected){
    span.classList.add('correct');
    playKeySound();
  } else {
    span.classList.add('wrong'); 
    session.mistakes++;
    playErrorSound();
  }
  session.totalTyped++;
  session.pos++;
  flashPress(typed);

  if(session.pos >= session.text.length){
    updateStats();
    finishLesson();
    return;
  }
  const nextSpan = document.querySelectorAll('#text-display .ch')[session.pos];
  if(nextSpan) nextSpan.classList.add('current');
  const nextCh = session.text[session.pos];
  highlightKey(nextCh, 'next');
  const hint = document.getElementById('finger-hint');
  hint.innerHTML = `পরের কী চাপুন: <b>${nextCh===' '?'স্পেস':nextCh.toUpperCase()}</b> — ${FINGER_NAME[FINGER_MAP[nextCh.toLowerCase()]||'thumb']}`;
  updateStats();
}

async function finishLesson(){
  playCompleteSound();
  const {wpm, acc} = updateStats();
  const prev = progress.completed[session.lsn.id];
  if(!prev || wpm > prev.wpm){
    progress.completed[session.lsn.id] = {wpm, acc, date:Date.now()};
  }
  if(session.idx >= progress.unlockedIndex && session.idx+1 <= FLAT_LESSONS.length){
    progress.unlockedIndex = Math.max(progress.unlockedIndex, session.idx+1);
  }
  await saveProgress();

  document.getElementById('result-wpm').textContent = wpm;
  document.getElementById('result-acc').textContent = acc + '%';
  document.getElementById('result-title').textContent =
    acc >= 95 ? 'চমৎকার হয়েছে! 🎉' : (acc >= 80 ? 'ভালো হয়েছে!' : 'আরেকবার চেষ্টা করলে ভালো হবে');
  document.getElementById('result-next').style.display =
    session.idx+1 < FLAT_LESSONS.length ? 'block' : 'none';
  document.getElementById('result-overlay').classList.add('open');
}

/* ============================================================
   INPUT HANDLING
   ============================================================ */
const input = document.getElementById('hidden-input');
document.getElementById('screen-lesson').addEventListener('click', ()=> input.focus());

let lastKeydownHandledAt = 0;

input.addEventListener('keydown', (e)=>{
  if(!session) return;
  if(e.key === 'Backspace'){
    e.preventDefault();
    return;
  }
  if(e.key === ' '){
    e.preventDefault();
    lastKeydownHandledAt = Date.now();
    handleChar(' ');
    return;
  }
  if(e.key.length === 1){
    e.preventDefault();
    lastKeydownHandledAt = Date.now();
    handleChar(e.key.toLowerCase());
  }
});

input.addEventListener('input', (e)=>{
  if(!session) return;
  const val = input.value;
  input.value = '';
  if(Date.now() - lastKeydownHandledAt < 150) return; 
  if(val.length > 0){
    for(let i = 0; i < val.length; i++){
      const ch = val[i].toLowerCase();
      handleChar(ch);
    }
  }
});

/* ============================================================
   NAVIGATION
   ============================================================ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('back-btn').addEventListener('click', ()=>{
  session = null;
  document.getElementById('result-overlay').classList.remove('open');
  renderHome();
  showScreen('screen-home');
});

document.getElementById('result-retry').addEventListener('click', ()=>{
  document.getElementById('result-overlay').classList.remove('open');
  openLesson(session.idx);
});

document.getElementById('result-next').addEventListener('click', ()=>{
  document.getElementById('result-overlay').classList.remove('open');
  const nextIdx = session.idx+1;
  if(nextIdx < FLAT_LESSONS.length) openLesson(nextIdx);
});

document.getElementById('reset-btn').addEventListener('click', async ()=>{
  progress = { completed:{}, unlockedIndex:0 };
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderHome();
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  renderKeyboard();
  await loadProgress();
  renderHome();
})();
</script>
